# Production stack. Lives at /opt/gict/compose.yml on the VPS.
#
# Deploy:  TAG=<git-sha> docker compose up -d
# Rollback: same command with an older SHA.

x-logging: &logging
  # Unbounded container logs filling the disk is the most common way a small
  # self-hosted stack dies, and the symptom (Postgres refusing writes) looks
  # nothing like the cause.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the ACME account key and issued certificates. Losing this volume
      # means re-issuing on every restart, which hits Let's Encrypt rate limits
      # during exactly the afternoon you can least afford it.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    volumes:
      # Postgres 18 keeps data in a subdirectory of this path, so pg_upgrade
      # --link works across a version bump without a mount-point boundary.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot. Applies pending migrations, then exits.
  #
  # If this exits non-zero, Compose stops before recreating `web`, so the old
  # container keeps serving. A failed migration is not an outage — verify this
  # still holds by deliberately breaking a migration once (see docs/RUNBOOK.md).
  migrate:
    image: ghcr.io/griffithict/gict-migrate:${TAG:-latest}
    restart: 'no'
    logging: *logging
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/griffithict/gict-web:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  caddy_data:
  caddy_config:
