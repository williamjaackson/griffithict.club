# Deployed by /srv/infra/scripts/deploy.sh, which sets IMAGE_TAG to the commit
# SHA. Rollback is the same script with an older SHA.
#
# Follows the host convention in /srv/infra/README.md: no published port except
# loopback, no database of its own, joins the shared `club` network and reaches
# Postgres at `postgres:5432`.

services:
  # Runs to completion before web starts. A non-zero exit aborts the deploy with
  # the previous container still serving, so a bad migration is not an outage.
  migrate:
    image: ghcr.io/williamjaackson/ict-web-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    env_file: /etc/club/ict-web.env
    init: true
    networks: [club]
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  web:
    image: ghcr.io/williamjaackson/ict-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: /etc/club/ict-web.env
    init: true
    read_only: true
    # Next writes its cache at runtime, so the one writable path is carved out
    # rather than dropping read_only altogether.
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    # Never bind 0.0.0.0: docker publishes past ufw.
    ports: ['127.0.0.1:3100:3000']
    healthcheck:
      # Liveness only. /api/health deliberately does not touch Postgres, so a
      # database blip cannot restart-loop the container.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [club]
    logging: *logging

networks:
  club:
    external: true
