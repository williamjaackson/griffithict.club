<!--
  Event — events and their tickets.

  The bands are the calendar's header, which is where a calendar is coloured
  anyway. The clearest of the set at 32px: the hangers and the grid read even
  when the colour does not.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F4F2F0"/>
  <defs><clipPath id="cal"><path d="M104,140 H408 A28,28 0 0 1 436,168 V396 A28,28 0 0 1 408,424 H104 A28,28 0 0 1 76,396 V168 A28,28 0 0 1 104,140 Z"/></clipPath></defs>
  <!-- Scaled about the centre to sit at the same weight as the other marks. -->
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <g clip-path="url(#cal)">
      <rect width="512" height="512" fill="#111010"/>
      <rect x="76" y="130" width="120.0" height="102" fill="#E51B13"/>
      <rect x="196.0" y="130" width="120.0" height="102" fill="#F4674E"/>
      <rect x="316.0" y="130" width="120.0" height="102" fill="#F9A99A"/>
    </g>
    <rect x="150" y="88" width="34" height="76" rx="17" fill="#111010"/><rect x="328" y="88" width="34" height="76" rx="17" fill="#111010"/>
    <g><rect x="118" y="262" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="188" y="262" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="258" y="262" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="328" y="262" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="118" y="318" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="188" y="318" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="258" y="318" width="44" height="30" rx="10" fill="#F4F2F0"/><rect x="328" y="318" width="44" height="30" rx="10" fill="#F4F2F0"/></g>
  </g>
</svg>
