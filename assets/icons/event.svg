<!--
  Event — events and their tickets.

  The bands are the calendar's header, which is where a calendar is coloured
  anyway.

  Six large cells rather than eight small ones: at 32px in a member list the
  smaller grid turns to mush and the shape stops reading as a calendar. The
  hangers stay for the same reason — they are what separate a calendar from a
  rectangle with a coloured strip, and they survive the small end.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F4F2F0"/>
  <defs><clipPath id="ed"><path d="M104,140 H408 A28,28 0 0 1 436,168 V396 A28,28 0 0 1 408,424 H104 A28,28 0 0 1 76,396 V168 A28,28 0 0 1 104,140 Z"/></clipPath></defs>
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <g clip-path="url(#ed)">
      <rect width="512" height="512" fill="#111010"/>
      <rect x="76" y="130" width="120.0" height="102" fill="#E51B13"/>
      <rect x="196.0" y="130" width="120.0" height="102" fill="#F4674E"/>
      <rect x="316.0" y="130" width="120.0" height="102" fill="#F9A99A"/>
    </g>
    <rect x="150" y="88" width="34" height="76" rx="17" fill="#111010"/><rect x="328" y="88" width="34" height="76" rx="17" fill="#111010"/>
    <g><rect x="112" y="272" width="72" height="44" rx="14" fill="#F4F2F0"/><rect x="216" y="272" width="72" height="44" rx="14" fill="#F4F2F0"/><rect x="320" y="272" width="72" height="44" rx="14" fill="#F4F2F0"/><rect x="112" y="334" width="72" height="44" rx="14" fill="#F4F2F0"/><rect x="216" y="334" width="72" height="44" rx="14" fill="#F4F2F0"/><rect x="320" y="334" width="72" height="44" rx="14" fill="#F4F2F0"/></g>
  </g>
</svg>
