<!--
  Boost — booster perks.

  Discord's own boost shape: a flat table, flaring to the girdle, tapering to a
  point. A pointed top instead reads as a house.

  The crown facets are knocked out exactly on the band edges, so the facets and
  the colours are the same lines. Drawn independently they became two competing
  grids and the gem stopped reading as cut.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F4F2F0"/>
  <defs><clipPath id="gb"><path d="M196,132 H316 L392,220 L256,384 L120,220 Z"/></clipPath></defs>
  <g clip-path="url(#gb)">
    <rect width="512" height="512" fill="#111010"/>
    <rect x="120" y="110" width="90.7" height="110" fill="#E51B13"/>
    <rect x="210.7" y="110" width="90.7" height="110" fill="#F4674E"/>
    <rect x="301.3" y="110" width="90.7" height="110" fill="#F9A99A"/>
  </g>
  <g stroke="#F4F2F0" stroke-width="9" fill="none">
    <path d="M196,132 L210.7,220"/>
    <path d="M316,132 L301.3,220"/>
    <path d="M120,220 H392"/>
  </g>
</svg>
