name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP: ict-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as latest, so rolling back is
      # deploy.sh with an older SHA and needs no understanding of any of this.
      - name: Build and push the site
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the Funnel bot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: funnel
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/funnel:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/funnel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the Reimburse bot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: reimburse
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/reimburse:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/reimburse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration runner
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP }}-migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # deploy.sh checks out the SHA on the host, pulls both images and brings
      # the stack up. Migrations run first via depends_on in deploy/compose.yaml,
      # so a failed migration stops the deploy rather than taking the site down.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "/srv/infra/scripts/deploy.sh ict-web ${{ github.sha }}"
