name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as latest, so a rollback is
      # `TAG=<old-sha> docker compose up -d` and needs no understanding of any
      # of this.
      - name: Build and push the site
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/gict-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/gict-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration runner
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/gict-migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/gict-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The deploy key is restricted to a forced command on the VPS, so the only
      # thing this can do is ask for a tag to be deployed. If the key leaks, the
      # blast radius is "an attacker can redeploy an existing image".
      # See docs/RUNBOOK.md for the authorized_keys line and the script.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "${{ github.sha }}"
