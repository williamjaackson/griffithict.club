- title: Social Events
  body: >-
    Game nights, BBQs, trivia, and casual hangouts. The best part of uni is the
    people, and we make sure you meet them.
- title: Industry Events
  body: >-
    Connect with companies hiring grads. Hear from engineers, ask questions, and
    get your foot in the door early.
- title: Hackathons
  body: >-
    Team up, ship fast, win prizes. We design and run our own hackathons that
    everyone can participate in.
- title: Workshops
  body: >-
    Hands-on sessions covering web dev, cloud, AI, cybersecurity, and more. Learn
    by building real things.
