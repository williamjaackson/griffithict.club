# Each entry is a role, not a person, because the role outlives whoever holds it.
#
# A term is two months: `from`, and `to` once it ends. Everything shown on the
# site — the date range, how long it ran, who currently holds the role — is worked
# out from those, so there is nothing to keep up to date. Leave `to` off the
# current holder.
#
# Order does not matter. The site sorts newest first.
- role: President
  about: >-
    Sets the club's direction, runs committee meetings, and is the club's point of
    contact with the university and with sponsors. Accountable for everything the
    club puts its name on.
  history:
    - name: William Jackson
      from: 2026-07
    - name: Owen Richardson
      from: 2025-03
      to: 2026-06

- role: Vice President
  about: >-
    Supports the President and steps in when they are unavailable. Owns event
    delivery day to day, making sure what the committee plans actually happens on
    the night.
  history:
    - name: Tylar Pinniger
      from: 2026-02
    - name: Michael Geurts
      from: 2025-09
      to: 2026-01

- role: Secretary
  about: >-
    Keeps the club's records: meeting minutes, the member register, and the
    paperwork the university requires. Handles club communications and
    announcements.
  history:
    - name: Julio Medeiros
      from: 2026-07
    - name: Zain Abrahams
      from: 2025-03
      to: 2026-06

- role: Treasurer
  about: >-
    Looks after the club's money: budgets for each event, sponsorship income,
    reimbursements, and reporting the accounts back to members.
  history:
    - name: Novak Bigic
      from: 2026-07
    - name: William Jackson
      from: 2025-03
      to: 2026-06
