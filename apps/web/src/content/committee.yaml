# Each entry is a role, not a person, because the role outlives whoever holds it.
#
# A term is two months: `from`, and `to` once it ends. Everything shown on the
# site — the date range, how long it ran, who currently holds the role — is worked
# out from those, so there is nothing to keep up to date. Leave `to` off the
# current holder.
#
# Order does not matter. The site sorts newest first.
#
# `photo` belongs to the term, not the person, so a past holder keeps their own
# face when the role changes hands. Anyone holding two terms is listed twice and
# needs it on both. Resize before committing: image optimisation is off, so a
# phone screenshot ships at full size to fill a 76px avatar. Around 400px on the
# long edge as JPEG.
- role: President
  about: >-
    Sets the club's direction with the committee and chairs its meetings.
    Acts as the club's ambassador and its main point of contact with the Student
    Guild.
  history:
    - name: William Jackson
      photo: /photos/committee/william-jackson.jpg
      from: 2026-07
    - name: Owen Richardson
      photo: /photos/committee/owen-richardson.jpg
      from: 2025-03
      to: 2026-06

- role: Vice President
  about: >-
    Supports the President and stands in when they are unavailable.
    Takes the lead on getting events delivered, so what the committee plans
    actually happens on the night.
  history:
    - name: Tylar Pinniger
      photo: /photos/committee/tylar-pinniger.jpg
      from: 2026-02
    - name: Michael Geurts
      photo: /photos/committee/michael-geurts.jpg
      from: 2025-09
      to: 2026-01

- role: Secretary
  about: >-
    Keeps the club's records and correspondence: meeting notices,
    agendas, minutes, and chasing the actions that come out of them. Coordinates
    committee and member meetings, including the AGM.
  history:
    - name: Julio Medeiros
      photo: /photos/committee/julio-medeiros.jpg
      from: 2026-07
    - name: Zain Abrahams
      photo: /photos/committee/zain-abrahams.jpg
      from: 2025-03
      to: 2026-06

- role: Treasurer
  about: >-
    Prepares the club's budget and tracks income and expenditure
    against it. Reports the accounts back to members and the Student Guild, and
    handles purchasing and reimbursements.
  history:
    - name: Novak Bigic
      photo: /photos/committee/novak-bigic.jpg
      from: 2026-07
    - name: William Jackson
      photo: /photos/committee/william-jackson.jpg
      from: 2025-03
      to: 2026-06
