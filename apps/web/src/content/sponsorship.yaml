# Benefits are a flat list, each tagged with the lowest tier that includes it.
# A tier shows every benefit at or below its own level, so the cards stay
# cumulative without repeating anything.
benefits:
  - level: 0
    label: Logo on club website
  - level: 0
    label: Social media recognition
  - level: 0
    label: Logo at events
  - level: 1
    label: Job and internship promotion
  - level: 1
    label: Newsletter and email promotion
  - level: 1
    label: Promotional materials at events
  - level: 2
    label: Access to networking events
  - level: 2
    label: Dedicated co-branded event
  - level: 2
    label: Highest placement on all materials

